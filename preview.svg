<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#10121d"/><rect x="40" y="64" width="1360" height="780" rx="16" fill="#1a1b26"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#c0caf5;font-size:18px}.quiet{fill:#8290b0;font-size:15px}.title{fill:#e3e8ff;font-weight:bold}</style><text x="44" y="38" class="quiet">MAIL FOR OMARCHY · FICTIONAL LAYOUT ILLUSTRATION</text><path d="M40 132H1400M270 132V844M718 132V844" stroke="#343b58"/><text x="66" y="107" class="title">Mail</text><text x="298" y="107">Compose</text><text x="432" y="107">Reply</text><text x="534" y="107">Archive</text><text x="654" y="107">Delete</text><text x="1110" y="107">Unread</text><text x="1250" y="107">Search</text><rect x="54" y="182" width="202" height="44" rx="7" fill="#29344e"/><text x="72" y="165" class="quiet">MAILBOXES</text><text x="72" y="210" class="title">All Inboxes</text><text x="72" y="257" class="">All Sent</text><text x="72" y="302" class="">Flagged</text><text x="72" y="380" class="quiet">ACCOUNTS</text><text x="72" y="425" class="">Personal</text><text x="72" y="470" class="">Studio</text><text x="72" y="770" class="quiet">Mail   Calendar</text><text x="72" y="809" class="quiet">Contacts</text><rect x="280" y="150" width="428" height="113" rx="6" fill="#263653"/><circle cx="298" cy="179" r="5" fill="#7aa2f7"/><text x="318" y="185" class="title" font-size="16">Alex Morgan</text><text x="318" y="213" class="title" font-size="16">Weekend plans</text><text x="318" y="242" class="quiet" font-size="16">How about a walk by the lake?</text><text x="680" y="185" text-anchor="end" class="quiet">10:42 AM</text><path d="M318 272H692" stroke="#343b58"/><circle cx="298" cy="305" r="5" fill="#7aa2f7"/><text x="318" y="311" class="title" font-size="16">Jordan Lee</text><text x="318" y="339" class="title" font-size="16">Design review</text><text x="318" y="368" class="quiet" font-size="16">The updated sketches are ready.</text><text x="680" y="311" text-anchor="end" class="quiet">9:18 AM</text><path d="M318 398H692" stroke="#343b58"/><text x="318" y="437" class="title" font-size="16">Community Library</text><text x="318" y="465" class="title" font-size="16">Your books are ready</text><text x="318" y="494" class="quiet" font-size="16">Two items are available for pickup.</text><text x="680" y="437" text-anchor="end" class="quiet">Yesterday</text><path d="M318 524H692" stroke="#343b58"/><text x="318" y="563" class="title" font-size="16">Casey Taylor</text><text x="318" y="591" class="title" font-size="16">Lunch next week</text><text x="318" y="620" class="quiet" font-size="16">Tuesday works well for me.</text><text x="680" y="563" text-anchor="end" class="quiet">Mon</text><path d="M318 650H692" stroke="#343b58"/><text x="318" y="689" class="title" font-size="16">Studio Notes</text><text x="318" y="717" class="title" font-size="16">Project update</text><text x="318" y="746" class="quiet" font-size="16">A quick recap of this week’s progress.</text><text x="680" y="689" text-anchor="end" class="quiet">Sun</text><path d="M318 776H692" stroke="#343b58"/><text x="758" y="189" class="title" style="font-size:28px">Weekend plans</text><text x="758" y="233" class="title">Alex Morgan</text><text x="758" y="260" class="quiet">To: You · Today at 10:42 AM</text><path d="M758 284H1360" stroke="#343b58"/><text x="758" y="333">Hi there,</text><text x="758" y="383">How about a walk by the lake this weekend?</text><text x="758" y="416">The weather is looking lovely, and there’s a</text><text x="758" y="449">new coffee shop nearby we could try.</text><text x="758" y="505">Let me know what time works for you.</text><text x="758" y="563">Alex</text><text x="44" y="880" class="quiet">Unified mailboxes · Quiet message rows · Compact controls · Mail and calendar</text></svg>